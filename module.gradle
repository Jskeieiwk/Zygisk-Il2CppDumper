ext {
    moduleLibraryName = "cloud_cheat"
    appId             = "com.cloud.crack.berda"
    appName           = "Cloud Crack 67"
    appAuthor         = "@Cloud_Crack 67"
    moduleVersion     = "1.0.1"
    moduleVersionCode = 101
}

afterEvaluate {
    android.applicationVariants.forEach { variant ->
        def variantCapped = variant.name.capitalize()
        def variantLowered = variant.name.toLowerCase()

        task("copy${variantCapped}Apk", type: Copy) {
            dependsOn("assemble$variantCapped")
            from(variant.outputs.first().outputFile)
            into outDir
            rename { String name -> "CloudCrack67-${variantLowered}.apk" }
        }

        variant.assembleProvider.get().finalizedBy("copy${variantCapped}Apk")
    }
}
