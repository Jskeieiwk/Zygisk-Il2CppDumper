name: build-cheat

on:
  workflow_dispatch:
  push:
    branches: [ccr-bec00c95-o6ymec]
    paths:
      - 'cheat/**'
      - 'cheat_rs/**'
      - 'cheat_ext/**'
      - '.github/workflows/build-cheat.yml'

permissions:
  contents: write

jobs:
  cpp-undetect:
    name: Build C++ r16-undetect
    runs-on: ubuntu-22.04
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android NDK + platform + build-tools
        run: |
          set -eux
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
              "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Prepare assets
        run: |
          mkdir -p cheat/assets
          if [ ! -f cheat/assets/hitsound.ogg ] && [ -f cheat/dist/rust_headshot.ogg ]; then
            cp cheat/dist/rust_headshot.ogg cheat/assets/hitsound.ogg
          fi

      - name: Build
        working-directory: cheat
        run: bash pack.sh

      - name: List outputs
        run: ls -lh cheat/dist/ | tee cheat_dist_listing.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cheat-cpp-sh
          path: |
            cheat/dist/update_*.sh
            cheat/dist/*.so
            cheat/dist/*.dex
            cheat_dist_listing.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish .sh back to the repo under dist-builds/
        run: |
          set -eux
          sh_file=$(ls cheat/dist/update_*.sh | head -n1)
          test -f "$sh_file"
          # Stash everything pack.sh dirtied so we can pull cleanly.
          cp "$sh_file" /tmp/cheat-built.sh
          git checkout -- . >/dev/null 2>&1 || true
          git clean -fd cheat/dist cheat/build cheat_rs/target cheat_rs/dist 2>/dev/null || true
          git config user.email "noreply@anthropic.com"
          git config user.name "cheat-ci"
          mkdir -p dist-builds
          name="update_$(date -u +%Y%m%dT%H%M%SZ)_${GITHUB_SHA::7}.sh"
          cp /tmp/cheat-built.sh "dist-builds/$name"
          cp /tmp/cheat-built.sh "dist-builds/latest.sh"
          git add dist-builds
          git commit -m "ci: publish build $name [skip ci]"
          pushed=0
          for i in 1 2 3; do
            git pull --rebase origin ccr-bec00c95-o6ymec && git push origin HEAD:ccr-bec00c95-o6ymec && { pushed=1; break; }
            sleep 5
          done
          test "$pushed" = 1

  cpp-external:
    name: Build C++ external probe
    runs-on: ubuntu-22.04
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android NDK
        run: |
          set -eux
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build + pack
        working-directory: cheat_ext
        run: bash pack.sh

      - name: Publish ext .sh to dist-builds/
        run: |
          set -eux
          sh_file=$(ls cheat_ext/dist/oxide_ext_*.sh | head -n1)
          test -f "$sh_file"
          cp "$sh_file" /tmp/oxide_ext.sh
          git checkout -- . >/dev/null 2>&1 || true
          git clean -fd cheat_ext/dist 2>/dev/null || true
          git config user.email "noreply@anthropic.com"
          git config user.name "cheat-ci"
          mkdir -p dist-builds
          name="oxide_ext_$(date -u +%Y%m%dT%H%M%SZ)_${GITHUB_SHA::7}.sh"
          cp /tmp/oxide_ext.sh "dist-builds/$name"
          cp /tmp/oxide_ext.sh "dist-builds/latest_ext.sh"
          git add dist-builds
          git commit -m "ci: publish ext build $name [skip ci]" || exit 0
          pushed=0
          for i in 1 2 3; do
            git pull --rebase origin ccr-bec00c95-o6ymec && git push origin HEAD:ccr-bec00c95-o6ymec && { pushed=1; break; }
            sleep 5
          done
          test "$pushed" = 1

  rust-skeleton:
    name: Build Rust skeleton (compile-check)
    runs-on: ubuntu-22.04
    continue-on-error: true
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android NDK + platform + build-tools
        run: |
          set -eux
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
              "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.80.0'
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cheat_rs/target
          key: cargo-${{ hashFiles('cheat_rs/**/Cargo.toml') }}

      - name: Build
        working-directory: cheat_rs
        run: bash pack.sh || { echo "rust pack.sh failed — expected while resolve_api is a TODO"; exit 0; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cheat-rust-sh
          path: cheat_rs/dist/
          if-no-files-found: warn
          retention-days: 7
