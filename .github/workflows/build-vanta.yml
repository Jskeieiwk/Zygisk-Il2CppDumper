name: Build VANTA (.sh)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ "ccr-6f3845d0-wvuvzu" ]
    paths:
      - "vanta-cheat/mod/**"
      - "vanta-cheat/helper/**"
      - ".github/workflows/build-vanta.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ABI: arm64-v8a
      API: 24
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK r27
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Configure CMake
        working-directory: vanta-cheat/mod
        run: |
          mkdir -p build
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI \
            -DANDROID_PLATFORM=android-$API \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_STL=c++_static

      - name: Build
        working-directory: vanta-cheat/mod
        run: cmake --build build --parallel

      - name: Strip
        working-directory: vanta-cheat/mod
        run: |
          STRIP=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          "$STRIP" --strip-unneeded build/libvanta.so
          "$STRIP" --strip-unneeded build/inject-arm64

      - name: Pack vanta.sh
        working-directory: vanta-cheat/mod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # считаем сколько уже vantaN.sh в релизе → следующий номер
          EXISTING=$(gh release view dump3 --json assets --jq '.assets[].name' 2>/dev/null \
                     | grep -oE '^vanta[0-9]+\.sh$' | grep -oE '[0-9]+' | sort -n | tail -1)
          NUM=$(( ${EXISTING:-0} + 1 ))
          echo "next vanta build = $NUM"
          python3 pack.py --template vanta.sh.in \
            --inj build/inject-arm64 \
            --so  build/libvanta.so \
            --out build/vanta${NUM}.sh
          cp build/vanta${NUM}.sh build/vanta.sh
          chmod +x build/vanta.sh build/vanta${NUM}.sh
          echo "BUILD_NUM=${NUM}" >> $GITHUB_ENV
          ls -la build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanta${{ env.BUILD_NUM }}
          path: |
            vanta-cheat/mod/build/vanta${{ env.BUILD_NUM }}.sh
            vanta-cheat/mod/build/libvanta.so
            vanta-cheat/mod/build/inject-arm64

      - name: Upload to release dump3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUM=${{ env.BUILD_NUM }}
          # vantaNN.sh — архив версий
          gh release upload dump3 vanta-cheat/mod/build/vanta${NUM}.sh || true
          # vanta.sh — всегда последний
          gh release upload dump3 vanta-cheat/mod/build/vanta.sh --clobber || true
