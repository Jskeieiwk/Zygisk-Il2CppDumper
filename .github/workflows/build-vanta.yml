name: Build VANTA overlay

on:
  workflow_dispatch:
  push:
    branches: [ "ccr-6f3845d0-wvuvzu" ]
    paths:
      - "vanta-cheat/**"
      - ".github/workflows/build-vanta.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vanta-cheat/overlay
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install cmdline + NDK
        run: |
          sdkmanager --install "platforms;android-35" \
                               "build-tools;35.0.0" \
                               "cmake;3.22.1" \
                               "ndk;27.1.12297006"

      - name: Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/vanta-overlay-v0.1.apk || \
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/vanta-overlay-v0.1.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanta-overlay
          path: vanta-cheat/overlay/out/
