name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - 'ccr-*'
      - 'master'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :module:assembleRelease --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CloudCrack67-berda
          path: |
            out/*.apk
            module/build/outputs/apk/release/*.apk
