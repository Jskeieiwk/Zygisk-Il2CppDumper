[package]
name = "payload"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
name = "payload"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
shared = { path = "../shared" }
libc = "0.2"
ctor = "0.2"
once_cell = "1.19"
parking_lot = "0.12"
# No `jni` here on purpose: dj wants zero JNI hot paths.
